name: Update Starred Repositories

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main branch (for testing)
  push:
    branches:
      - main
      - master
      - claude/*

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and update starred repositories
        env:
          GITHUB_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: |
          python update_starred_repos.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet README.md starred_repos.xlsx starred_repos.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md starred_repos.xlsx starred_repos.html
          git commit -m "🤖 Auto-update starred repositories - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "No changes detected in starred repositories"
